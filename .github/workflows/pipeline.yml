name: Pipeline

# 쇼츠 파이프라인의 자동 단계(대본·장면·합성·업로드)를 에피소드 하나에 대해 실행한다.
# probe 는 에피소드 없이 ManyMotions·Claude 모델 목록과 Claude 실제 청구 비용을 조회한다(설정·목록 화면).
# probe 는 매일 한 번 자동으로도 돈다(schedule). 그때는 입력이 없으므로 probe 로 본다.
# 보통은 대시보드 버튼이 GitHub API 로 이 워크플로를 실행한다(사용자가 이 화면을 볼 일은 없다).
# 직접 실행해도 된다: Actions → Pipeline → Run workflow.
#
# 상태 기록은 전부 `npm run pipeline` 이 DB 에 한다. 여기서는 실행 환경만 준비한다.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 실행할 단계
        type: choice
        required: true
        options: [script, render, compose, upload, probe]
      episode_id:
        description: 에피소드 번호 (probe 는 비워 둠)
        type: string
        required: false
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST

run-name: "${{ inputs.episode_id && format('#{0} ', inputs.episode_id) || '' }}${{ inputs.step || 'probe' }}"

# 같은 에피소드는 한 번에 하나씩. 다른 에피소드는 동시에 돌 수 있다. probe 끼리도 하나씩.
concurrency:
  group: pipeline-${{ (inputs.step || 'probe') == 'probe' && 'probe' || format('episode-{0}', inputs.episode_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  run:
    name: Run step
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # deploy.yml 과 같은 환경의 시크릿(DATABASE_URL 등)을 쓴다.
    environment: production
    timeout-minutes: 45
    env:
      # 입력값은 스크립트에 직접 끼우지 않고 환경변수로만 넘긴다.
      STEP: ${{ inputs.step || 'probe' }}
      EPISODE_ID: ${{ inputs.episode_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run
        id: run
        # 외부 API 키는 이 단계에만 넘긴다(npm ci 같은 다른 단계에는 노출하지 않음).
        env:
          MANYMOTIONS_API_KEY: ${{ secrets.MANYMOTIONS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 실제 청구 비용 조회용 Admin 키는 조직 관리 권한까지 있어서 probe 실행에만 넘긴다(선택, 없으면 건너뜀).
          ANTHROPIC_ADMIN_KEY: ${{ (inputs.step || 'probe') == 'probe' && secrets.ANTHROPIC_ADMIN_KEY || '' }}
          # 선택: 이 워크스페이스의 비용만 센다(Console 의 wrkspc_… ID, 기본 워크스페이스는 default).
          ANTHROPIC_COST_WORKSPACE_ID: ${{ vars.ANTHROPIC_COST_WORKSPACE_ID }}
        run: npm run pipeline -- run "$STEP" "$EPISODE_ID"

      # 시간 초과·취소·설치 실패처럼 위 단계가 스스로 실패를 기록하지 못한 경우에 대비한다.
      # 이미 기록됐거나 실행 중이 아니면 아무것도 바꾸지 않는다.
      - name: Record interruption
        if: ${{ (failure() || cancelled()) && steps.run.outcome != 'failure' }}
        run: npm run pipeline -- fail "$STEP" "$EPISODE_ID" "Actions 실행이 중간에 중단되었습니다. 다시 시도하세요."
