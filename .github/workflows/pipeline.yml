name: Pipeline

# 쇼츠 파이프라인의 자동 단계(대본·장면·합성·업로드)를 에피소드 하나에 대해 실행한다.
# probe 는 에피소드 없이 ManyMotions·Claude 모델 목록과 Claude 실제 청구 비용을 조회한다(설정·목록 화면).
# probe 는 매일 한 번 자동으로도 돈다(schedule). 그때는 입력이 없으므로 probe 로 본다.
# 같은 매일 실행에서 영상 클립 자동 수집(clips-daily)도 한다. 대시보드에서 켜 둔 경우에만 실제로 수집한다(기본 꺼짐).
# 따로 schedule 을 두지 않는 것은 꺼져 있을 때 Actions 사용 시간이 늘지 않게 하기 위해서다.
# clips 는 무료 라이선스 영상 클립 수집, clips-adopt 는 선택된 클립의 다운로드·mp4 변환·Blob 저장(대상: collection_id).
# ideas 는 채널 추천 만들기(생성형: 카테고리별 기획안, 편집형: 소재 풀 채우기 + 스토리 후보, 대상: idea_run_id). 매일 실행에서는 자동 추천이 켜진 채널만 주기마다(ideas-daily, 기본 꺼짐).
# 보통은 대시보드 버튼이 GitHub API 로 이 워크플로를 실행한다(사용자가 이 화면을 볼 일은 없다).
# 직접 실행해도 된다: Actions → Pipeline → Run workflow.
#
# 상태 기록은 전부 `npm run pipeline` 이 DB 에 한다. 여기서는 실행 환경만 준비한다.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 실행할 단계
        type: choice
        required: true
        options: [script, voice, render, compose, upload, reschedule, probe, clips, clips-adopt, ideas]
      episode_id:
        description: 에피소드 번호 (probe·clips 는 비워 둠)
        type: string
        required: false
      collection_id:
        description: 클립 수집 번호 (clips·clips-adopt 만)
        type: string
        required: false
      idea_run_id:
        description: 추천 실행 번호 (ideas 만)
        type: string
        required: false
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST

run-name: "${{ inputs.episode_id && format('#{0} ', inputs.episode_id) || '' }}${{ inputs.collection_id && format('clip collection {0} ', inputs.collection_id) || '' }}${{ inputs.idea_run_id && format('idea run {0} ', inputs.idea_run_id) || '' }}${{ inputs.step || 'probe' }}"

# 같은 에피소드(수집)는 한 번에 하나씩. 다른 에피소드는 동시에 돌 수 있다. probe 끼리도 하나씩.
concurrency:
  group: pipeline-${{ (inputs.step || 'probe') == 'probe' && 'probe' || (inputs.collection_id && format('clips-{0}', inputs.collection_id) || (inputs.idea_run_id && format('ideas-{0}', inputs.idea_run_id) || format('episode-{0}', inputs.episode_id))) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  run:
    name: Run step
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # deploy.yml 과 같은 환경의 시크릿(DATABASE_URL 등)을 쓴다.
    environment: production
    timeout-minutes: 45
    env:
      # 입력값은 스크립트에 직접 끼우지 않고 환경변수로만 넘긴다.
      STEP: ${{ inputs.step || 'probe' }}
      # 대상 번호: 에피소드, 또는 clips·clips-adopt 면 수집 번호, ideas 면 추천 실행 번호.
      TARGET_ID: ${{ inputs.collection_id || inputs.idea_run_id || inputs.episode_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # 영상 합성(compose, 그리고 장면 생성 뒤 이어지는 합성)에는 ffmpeg 와 한글 폰트(Noto Sans CJK, OFL)가 필요하다.
      # 클립 채택(clips-adopt)은 mp4 변환에 ffmpeg 를 쓴다.
      - name: Install ffmpeg and Korean font
        if: ${{ env.STEP == 'render' || env.STEP == 'compose' || env.STEP == 'clips-adopt' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Run
        id: run
        # 외부 API 키는 이 단계에만 넘긴다(npm ci 같은 다른 단계에는 노출하지 않음).
        env:
          MANYMOTIONS_API_KEY: ${{ secrets.MANYMOTIONS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 생성물(내레이션·장면) 저장용 Vercel Blob 토큰.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 실제 청구 비용 조회용 Admin 키는 조직 관리 권한까지 있어서 probe 실행에만 넘긴다(선택, 없으면 건너뜀).
          ANTHROPIC_ADMIN_KEY: ${{ (inputs.step || 'probe') == 'probe' && secrets.ANTHROPIC_ADMIN_KEY || '' }}
          # 선택: 이 워크스페이스의 비용만 센다(Console 의 wrkspc_… ID, 기본 워크스페이스는 default).
          ANTHROPIC_COST_WORKSPACE_ID: ${{ vars.ANTHROPIC_COST_WORKSPACE_ID }}
          # 소재 검색(clips, 편집형 채널의 ideas 소재 풀)에만 넘긴다. 없으면 Pixabay 만 꺼지고 결과에 이유가 남는다.
          PIXABAY_API_KEY: ${{ (inputs.step == 'clips' || inputs.step == 'ideas') && secrets.PIXABAY_API_KEY || '' }}
          # 유튜브 업로드(upload)와 예약 시각 변경(reschedule)에만 넘긴다. 발급 방법: docs/youtube-setup.md
          # 리프레시 토큰은 채널마다 따로다(channels.youtube_token_secret). 업로드 단계가 에피소드 채널의 것만 읽는다.
          YOUTUBE_CLIENT_ID: ${{ (inputs.step == 'upload' || inputs.step == 'reschedule') && secrets.YOUTUBE_CLIENT_ID || '' }}
          YOUTUBE_CLIENT_SECRET: ${{ (inputs.step == 'upload' || inputs.step == 'reschedule') && secrets.YOUTUBE_CLIENT_SECRET || '' }}
          YOUTUBE_REFRESH_TOKEN: ${{ (inputs.step == 'upload' || inputs.step == 'reschedule') && secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          YOUTUBE_REFRESH_TOKEN_SAESAE: ${{ (inputs.step == 'upload' || inputs.step == 'reschedule') && secrets.YOUTUBE_REFRESH_TOKEN_SAESAE || '' }}
        run: npm run pipeline -- run "$STEP" "$TARGET_ID"

      # 매일 실행에서만. 꺼져 있으면 DB 만 보고 바로 끝난다. probe 가 실패해도 수집은 시도한다.
      - name: Daily clip collection
        if: ${{ github.event_name == 'schedule' && !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npm run pipeline -- run clips-daily

      # 매일 실행에서만. 채널 설정에서 자동 추천을 켠 채널만 주기(기본 이틀)마다 기획안을 만든다(Claude 비용, 기본 꺼짐).
      - name: Daily ideas
        if: ${{ github.event_name == 'schedule' && !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 편집형 채널은 스토리 전에 소재 풀을 채운다(무료 소스).
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npm run pipeline -- run ideas-daily

      # 시간 초과·취소·설치 실패처럼 위 단계가 스스로 실패를 기록하지 못한 경우에 대비한다.
      # 이미 기록됐거나 실행 중이 아니면 아무것도 바꾸지 않는다.
      - name: Record interruption
        if: ${{ (failure() || cancelled()) && steps.run.outcome != 'failure' }}
        run: npm run pipeline -- fail "$STEP" "$TARGET_ID" "Actions 실행이 중간에 중단되었습니다. 다시 시도하세요."
